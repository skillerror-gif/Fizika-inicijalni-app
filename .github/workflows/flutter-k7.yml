name: Flutter K7
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths-ignore:
      - '**.md'
      - '.vscode/**'
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform
        run: flutter create --platforms=android --org rs.fizika.gimnazija --project-name fizika_adaptivno_vezbanje .
      - name: Install verified Tesla + motor launcher icon
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          for spec in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            density="${spec%%:*}"
            size="${spec##*:}"
            out="android/app/src/main/res/mipmap-$density"
            mkdir -p "$out"
            rm -f "$out"/ic_launcher*
            convert assets/branding/tesla_motor_launcher_source.png -resize "${size}x${size}^" -gravity center -extent "${size}x${size}" "$out/ic_launcher.png"
            cp "$out/ic_launcher.png" "$out/ic_launcher_round.png"
          done
          sed -i 's|android:icon="@mipmap/ic_launcher"|android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round"|' android/app/src/main/AndroidManifest.xml
      - name: Set Android visible app name
        run: sed -i 's/android:label="[^"]*"/android:label="Fizika za III razred gimnazije"/' android/app/src/main/AndroidManifest.xml
      - name: Remove generated widget test
        run: rm -f test/widget_test.dart
      - name: Dependencies
        run: flutter pub get
      - name: Validate content
        run: python3 tool/validate_content.py
      - name: Check source formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze
      - name: Tests
        run: flutter test
      - name: Build Android APK
        run: flutter build apk --release
      - name: Verify launcher pixels inside built APK
        run: |
          python3 - <<'PY'
          import pathlib
          import subprocess
          import tempfile
          import zipfile

          expected = pathlib.Path("android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png")
          apk = pathlib.Path("build/app/outputs/flutter-apk/app-release.apk")
          matches = 0
          with zipfile.ZipFile(apk) as archive, tempfile.TemporaryDirectory() as tmp:
              for i, name in enumerate(archive.namelist()):
                  if not name.startswith("res/") or not name.endswith(".png"):
                      continue
                  actual = pathlib.Path(tmp) / f"{i}.png"
                  actual.write_bytes(archive.read(name))
                  dimensions = subprocess.check_output(
                      ["identify", "-format", "%wx%h", str(actual)], text=True
                  )
                  if dimensions != "192x192":
                      continue
                  result = subprocess.run(
                      ["compare", "-metric", "AE", str(expected), str(actual), "null:"],
                      capture_output=True, text=True
                  )
                  if result.returncode == 0 and result.stderr.strip() == "0":
                      matches += 1
          assert matches >= 1, "Packaged 192px launcher does not match Tesla source"
          print(f"PASS: {matches} packaged 192px launcher image(s) match source pixels")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fizika-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  ios-compile:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate iOS platform
        run: flutter create --platforms=ios --org rs.fizika.gimnazija .
      - name: Remove generated widget test
        run: rm -f test/widget_test.dart
      - name: Dependencies
        run: flutter pub get
      - name: Check source formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze
      - name: Tests
        run: flutter test
      - name: Build iOS unsigned
        run: flutter build ios --release --no-codesign
