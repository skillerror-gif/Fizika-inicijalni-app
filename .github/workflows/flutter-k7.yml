name: Flutter K7
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform
        run: flutter create --platforms=android --org rs.fizika.gimnazija --project-name fizika_adaptivno_vezbanje .
      - name: Set Android visible app name
        run: sed -i 's/android:label="[^"]*"/android:label="Fizika za I razred gimnazije"/' android/app/src/main/AndroidManifest.xml
      - name: Remove generated widget test
        run: rm -f test/widget_test.dart
      - name: Dependencies
        run: flutter pub get
      - name: Validate content
        run: python3 tool/validate_content.py
      - name: Check source formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze
      - name: Tests
        run: flutter test
      - name: Build Android APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: fizika-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  ios-compile:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate iOS platform
        run: flutter create --platforms=ios --org rs.fizika.gimnazija .
      - name: Remove generated widget test
        run: rm -f test/widget_test.dart
      - name: Dependencies
        run: flutter pub get
      - name: Check source formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze
      - name: Tests
        run: flutter test
      - name: Build iOS unsigned
        run: flutter build ios --release --no-codesign
 
